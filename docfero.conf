# ═══════════════════════════════════════════
# DOCFERO — Nginx Config for Hostinger VPS
# ═══════════════════════════════════════════
# 
# This config does 2 things:
#   1. Serves your static frontend (HTML/CSS/JS) 
#   2. Proxies /api/* requests to your Node.js backend
#
# SETUP:
#   1. Replace docfero.com with your actual domain
#   2. Replace /var/www/docfero with your frontend path
#   3. Copy to: sudo cp docfero.conf /etc/nginx/sites-available/docfero.conf
#   4. Enable:  sudo ln -s /etc/nginx/sites-available/docfero.conf /etc/nginx/sites-enabled/
#   5. Test:    sudo nginx -t
#   6. Reload:  sudo systemctl reload nginx

server {
    listen 80;
    server_name docfero.com www.docfero.com;

    # Redirect HTTP to HTTPS (after SSL setup)
    # return 301 https://$server_name$request_uri;

    # ── FRONTEND (Static Files) ──
    root /var/www/docfero;
    index index.html;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── BACKEND API (Proxy to Node.js) ──
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File upload settings
        client_max_body_size 110M;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        # Disable buffering for file downloads
        proxy_buffering off;
    }

    # ── SECURITY HEADERS ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block common attacks
    location ~ /\. { deny all; }
    location ~* \.(env|git|bak|sql|log)$ { deny all; }
}

